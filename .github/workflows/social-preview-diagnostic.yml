name: Social Preview Live Diagnostic

on:
  push:
    branches:
      - fix/social-preview-live-debug
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect localized blog routing
        shell: bash
        run: |
          set -euxo pipefail
          UA="facebookexternalhit/1.1"
          URLS=(
            "https://negibamaxim.eu/"
            "https://negibamaxim.eu/ro"
            "https://negibamaxim.eu/blog/how-much-does-it-work-cost-romania-hourly-rates-2026"
            "https://negibamaxim.eu/ro/blog/cat-costa-o-ora-de-munca-it-in-romania-ghid-2026"
            "https://negibamaxim.eu/ro/blog/how-much-does-it-work-cost-romania-hourly-rates-2026"
            "https://negibamaxim.eu/blog/cat-costa-o-ora-de-munca-it-in-romania-ghid-2026"
            "https://negibamaxim.eu/ro/blog/de-ce-20-de-euro-pe-ora-inseamna-sa-lucrezi-aproape-gratis"
          )

          for URL in "${URLS[@]}"; do
            echo
            echo "===== $URL ====="
            curl -L -sS -A "$UA" -o /tmp/page.html -w "HTTP=%{http_code} FINAL=%{url_effective}\n" "$URL"
            grep -Eio '<title>[^<]*</title>' /tmp/page.html | head -n1 || true
            grep -Eio '<meta[^>]+property="og:image"[^>]*>' /tmp/page.html | head -n1 || true
          done
