name: Social Preview Live Diagnostic

on:
  push:
    branches:
      - fix/social-preview-live-debug
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live page and Open Graph image
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://negibamaxim.eu/ro/blog/cat-costa-o-ora-de-munca-it-in-romania-ghid-2026"
          UA="facebookexternalhit/1.1"

          curl -L -A "$UA" -D /tmp/page.headers -o /tmp/page.html "$URL"
          echo "=== PAGE HEADERS ==="
          cat /tmp/page.headers
          echo "=== SOCIAL META ==="
          grep -Eio '<meta[^>]+(og:|twitter:)[^>]*>' /tmp/page.html || true

          IMAGE_URL=$(grep -Eio '<meta[^>]+property="og:image"[^>]+content="[^"]+"' /tmp/page.html | head -n1 | sed -E 's/.*content="([^"]+)".*/\1/' || true)
          if [ -z "$IMAGE_URL" ]; then
            IMAGE_URL=$(grep -Eio '<meta[^>]+content="[^"]+"[^>]+property="og:image"' /tmp/page.html | head -n1 | sed -E 's/.*content="([^"]+)".*/\1/' || true)
          fi

          echo "OG_IMAGE=$IMAGE_URL"

          if [ -n "$IMAGE_URL" ]; then
            echo "=== IMAGE HEADERS AS FACEBOOK ==="
            curl -L -A "$UA" -D /tmp/image.headers -o /tmp/image.bin "$IMAGE_URL"
            cat /tmp/image.headers
            echo "=== IMAGE FILE INFO ==="
            file /tmp/image.bin
            wc -c /tmp/image.bin
          fi
